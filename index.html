<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta
      name="description"
      content="Duskwarden — drag your horrors across the veil. Convert TTRPG monsters between nine systems, build campaign projects, and search the bestiary."
    />
    <meta name="theme-color" content="#0b0908" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('duskwarden-theme')
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.setAttribute('data-theme', theme)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'light' ? '#f4efe6' : '#0b0908')
        } catch (e) {}
      })()
    </script>
    <title>Duskwarden · Monster Transmutation Engine</title>
